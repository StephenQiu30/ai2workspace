schemaVersion: 1
id: ai2workspace-dev
name: ai2workspace 研发空间
profile: development
sources:
  - id: knowledge
    binding: knowledge-root
    kind: knowledge
    include: ['**/*.md']
    exclude: []
    writePolicy: task-scoped
  - id: engineering-rules
    binding: service-root
    kind: instruction
    projectId: service
    include:
      [
        AGENTS.md,
        PROJECT.md,
        DESIGN.md,
        harness/README.md,
        harness/standards.md,
      ]
    exclude: []
    writePolicy: task-scoped
  - id: templates
    binding: templates-root
    kind: reference
    include: ['knowledge/*.md', 'workspace/README.md', 'tasks/README.md']
    exclude: []
    writePolicy: read-only
projects:
  - id: service
    binding: service-root
    inputExclude:
      - '**/*.tsbuildinfo'
      - '**/node_modules/**'
      - '**/.git/**'
      - '**/.next/**'
      - '**/.source/**'
      - '**/dist/**'
      - '**/.test-build/**'
      - '**/test-results/**'
      - '**/playwright-report/**'
      - '**/.local/**'
      - '**/workspace.local.yaml'
harness:
  projectId: service
  policyPath: harness/policy.json
checks:
  - id: repository-alignment
    projectId: service
    cwd: .
    argv: [pnpm, check:workspace]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []
  - id: service-types
    projectId: service
    cwd: .
    argv: [pnpm, types:check]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []
  - id: service-tests
    projectId: service
    cwd: .
    argv: [pnpm, test]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []

  - id: service-lint
    projectId: service
    cwd: .
    argv: [pnpm, lint]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []

  - id: service-format
    projectId: service
    cwd: .
    argv: [pnpm, format:check]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []

  - id: service-build
    projectId: service
    cwd: .
    argv: [pnpm, build]
    timeoutMs: 180000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []

  - id: service-browser
    projectId: service
    cwd: .
    argv: [pnpm, test:e2e]
    timeoutMs: 240000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI, WORKSPACE_TEST_PORT]
      privateRefs: []
    artifacts: []

  - id: service-bundle
    projectId: service
    cwd: .
    argv: [pnpm, test:bundle]
    timeoutMs: 120000
    required: true
    tools:
      - id: node
        argv: [node, --version]
      - id: pnpm
        argv: [pnpm, --version]
    environment:
      publicNames: [NODE_ENV, CI]
      privateRefs: []
    artifacts: []
