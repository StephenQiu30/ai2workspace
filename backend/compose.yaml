name: ai2workspace

services:
  gateway:
    image: traefik:v3.6.0
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --api.dashboard=false
    ports:
      - "127.0.0.1:3121:80"
    volumes:
      - ./traefik.yaml:/etc/traefik/dynamic.yaml:ro
    depends_on:
      - frontend
      - ai2workspace

  ai2workspace:
    build:
      context: ..
      dockerfile: backend/services/ai2workspace/Dockerfile
    environment:
      HTTP_ADDR: :3123
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:3123:3123"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3123/api/ai2workspace/v1/health]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      PORT: 3121
      API_ORIGIN: http://ai2workspace:3123
    depends_on:
      ai2workspace:
        condition: service_healthy
