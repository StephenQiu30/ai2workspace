http:
  routers:
    identity:
      rule: PathPrefix(`/api/identity/`) || PathPrefix(`/swagger/identity/`)
      priority: 100
      service: identity
    frontend:
      rule: PathPrefix(`/`)
      service: frontend
  services:
    identity:
      loadBalancer:
        servers:
          - url: http://identity:3123
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3121
