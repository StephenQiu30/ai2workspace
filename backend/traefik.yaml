http:
  routers:
    identity:
      rule: PathPrefix(`/api/identity/`) || PathPrefix(`/swagger/identity/`)
      priority: 100
      service: identity
    learning:
      rule: PathPrefix(`/api/learning/`) || PathPrefix(`/swagger/learning/`)
      priority: 100
      service: learning
    commerce:
      rule: PathPrefix(`/api/commerce/`) || PathPrefix(`/swagger/commerce/`)
      priority: 100
      service: commerce
    community:
      rule: PathPrefix(`/api/community/`) || PathPrefix(`/swagger/community/`)
      priority: 100
      service: community
    assistant:
      rule: PathPrefix(`/api/assistant/`) || PathPrefix(`/swagger/assistant/`)
      priority: 100
      service: assistant
    studio:
      rule: PathPrefix(`/api/studio/`) || PathPrefix(`/swagger/studio/`)
      priority: 100
      service: studio
    frontend:
      rule: PathPrefix(`/`)
      service: frontend
  services:
    identity:
      loadBalancer:
        servers:
          - url: http://identity:3123
    learning:
      loadBalancer:
        servers:
          - url: http://learning:3124
    commerce:
      loadBalancer:
        servers:
          - url: http://commerce:3125
    community:
      loadBalancer:
        servers:
          - url: http://community:3126
    assistant:
      loadBalancer:
        servers:
          - url: http://assistant:3127
    studio:
      loadBalancer:
        servers:
          - url: http://studio:3128
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3121
