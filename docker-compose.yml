name: ai2workspace

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: ai2workspace
      POSTGRES_PASSWORD: ai2workspace-local
      POSTGRES_DB: ai2workspace
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ai2workspace, -d, ai2workspace]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: :3123
      DATABASE_URL: postgres://ai2workspace:ai2workspace-local@postgres:5432/ai2workspace?sslmode=disable
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      DEV_EXPOSE_TOKENS: ${DEV_EXPOSE_TOKENS:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PLAYBACK_SIGNING_SECRET: ${PLAYBACK_SIGNING_SECRET:-ai2workspace-local-playback}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      AI_ALLOW_LOCAL_SIMULATION: ${AI_ALLOW_LOCAL_SIMULATION:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3123:3123"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3123/api/health]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_ORIGIN: http://backend:3123
    ports:
      - "127.0.0.1:3121:3121"
    depends_on:
      backend:
        condition: service_healthy

  workspace:
    build:
      context: .
      dockerfile: workspace/Dockerfile
    ports:
      - "127.0.0.1:3122:3122"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3122/]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
